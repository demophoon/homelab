log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ci:host"

cache:
  enabled: true
  dir: /data/cache

container:
  network: host
  privileged: true
  valid_volumes:
    - /usr/local/share/ca-certificates
  docker_host: "-"

server:
  connections:
    brittg:
      url: https://git.brittg.com/
