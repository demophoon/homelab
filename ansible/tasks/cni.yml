---
- name: Check whether CNI plugins are already installed
  ansible.builtin.stat:
    path: /opt/cni/bin/bridge
  register: cni_bridge_bin

- name: Download CNI plugins archive
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ resolved_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: "/tmp/cni-plugins-linux-{{ resolved_arch }}-v{{ cni_plugins_version }}.tgz"
    checksum: "sha256:https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ resolved_arch }}-v{{ cni_plugins_version }}.tgz.sha256"
    mode: "0644"
  when: not cni_bridge_bin.stat.exists

- name: Install CNI plugins
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins-linux-{{ resolved_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true
  when: not cni_bridge_bin.stat.exists
