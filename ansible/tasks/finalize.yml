---
- name: Generate Forgejo runner registration token
  ansible.builtin.command: /home/runner/runner-token.sh
  args:
    creates: /home/runner/token

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Ensure core services are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - qemu-guest-agent
    - docker
    #- tailscaled
    #- consul
    #- nomad
    #- dnsmasq
    - forgejo-runner
