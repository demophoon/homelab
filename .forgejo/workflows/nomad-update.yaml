on:
  push:
    branches:
      - main

env:
  NOMAD_ADDR: https://nomad.service.consul.demophoon.com:4646

jobs:
  prod-home:
    runs-on: docker
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: true
      - id: prod-home
        uses: ./.forgejo/actions/dispatch-terraform
        with:
          workspace: prod-home
      - id: nomad-cascadia
        uses: ./.forgejo/actions/dispatch-terraform
        with:
          workspace: nomad-cascadia
      - id: renovate
        uses: ./.forgejo/actions/renovate
