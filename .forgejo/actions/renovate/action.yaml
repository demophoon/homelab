name: 'Run Renovate'
author: 'Britt Gresham'
description: |
  This action dispatches a Nomad job that runs Renovate to update dependencies.
  This action will wait until the job is complete before finishing.

runs:
  using: 'composite'
  steps:
    - name: 'Run Renovate'
      run: |
        nomad job periodic force renovate | tee nomad.output
        while true; do
          STATUS=$(nomad job status --short $(grep 'Dispatched Job ID' nomad.output | awk '{print $5}') | grep Status | awk '{print $3}')
          if [[ "$STATUS" == "dead" ]]; then
            echo "Job completed successfully."
            break
          elif [[ "$STATUS" == "running" ]]; then
            echo "Current status: $STATUS. Waiting for completion..."
            sleep 10
          else
            echo "Job failed."
            exit 1
          fi
        done
